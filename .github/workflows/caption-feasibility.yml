name: Caption access feasibility
on:
  push:
    branches:
      - chatgpt/pen-002b-live-caption-probes
  pull_request:
    paths:
      - 'scripts/probe_public_captions.py'
      - 'tests/test_caption_probe.py'
      - '.github/workflows/caption-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline URL and caption parser tests
        run: |
          npm run check
          python -m unittest discover -s tests -p "test_caption_probe.py" -v
      - name: Install one public YouTube caption client
        run: python -m pip install --disable-pip-version-check youtube-transcript-api==1.2.4
      - name: Probe two TikTok and one YouTube caption examples
        run: python -m scripts.probe_public_captions --require-tiktok

